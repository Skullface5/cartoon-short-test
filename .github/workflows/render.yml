name: render-highfive

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Remotion's Chrome headless shell needs the usual shared libs; install a superset and
      # ignore the names that do not exist on this Ubuntu release.
      - name: Browser shared libraries
        run: |
          sudo apt-get update -qq || true
          for p in libnss3 libdbus-1-3 libatk1.0-0 libatk1.0-0t64 libatk-bridge2.0-0 \
                   libatk-bridge2.0-0t64 libcups2 libcups2t64 libdrm2 libxkbcommon0 \
                   libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
                   libcairo2 libasound2 libasound2t64 libx11-xcb1 libxshmfence1 xdg-utils \
                   fonts-liberation; do
            sudo apt-get install -y -qq "$p" >/dev/null 2>&1 || true
          done

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render 1080x1920 short
        run: |
          mkdir -p out
          npx remotion render src/index.ts TestShort out/highfive.mp4 \
            --codec h264 --crf 16 --concurrency 2

      - name: Upload the mp4
        uses: actions/upload-artifact@v4
        with:
          name: highfive-mp4
          path: out/highfive.mp4
          if-no-files-found: error
